# GitHub Actions workflow to build and deploy to GitHub Pages
#
# This workflow:
# 1. Checks out the repository
# 2. Runs the tests, then the build script (copies the site to dist/)
# 3. Deploys dist/ to GitHub Pages
#
# To enable:
# 1. Go to repository Settings > Pages
# 2. Set Source to "GitHub Actions"

name: Deploy to GitHub Pages

on:
  # Run on push to main branch
  push:
    branches: [main]
  
  # Allow manual trigger from Actions tab
  workflow_dispatch:

# No default permissions; each job asks only for what it needs
permissions: {}

# Only allow one deployment at a time
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read  # configure-pages reads the site's Pages settings
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      
      - name: Run tests
        run: node --test tests/

      - name: Run build script
        run: node scripts/build.js
      
      - name: Setup GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
